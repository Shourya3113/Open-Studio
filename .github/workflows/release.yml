name: Open Studio Multi-Platform Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-release-verification:
    name: 🛡️ Pre-Release Air-Gap & Packaging Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Air-Gap Security Audit
        run: node scripts/verify-airgap.mjs

      - name: Run Multi-Platform Packaging Audit
        run: node scripts/verify-packaging.mjs

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Frontend Tests
        run: npm test -- --run

  build-release-installers:
    name: 📦 Build (${{ matrix.platform_name }})
    needs: pre-release-verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: Windows (MSI & NSIS EXE)
            bundle_ext: '*.msi,*.exe'
            artifact_name: open-studio-windows

          - os: macos-latest
            platform_name: macOS Apple Silicon (DMG)
            bundle_ext: '*.dmg'
            artifact_name: open-studio-macos-arm64

          - os: ubuntu-22.04
            platform_name: Linux (AppImage & DEB)
            bundle_ext: '*.AppImage,*.deb'
            artifact_name: open-studio-linux-x64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application Bundle
        run: npm run build

      - name: Build Native Tauri Bundles & Installers
        run: npx @tauri-apps/cli build

      - name: Collect Bundled Installers
        shell: bash
        run: |
          mkdir -p dist-installers
          # Copy generated bundles based on OS
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp -v src-tauri/target/release/bundle/msi/*.msi dist-installers/ 2>/dev/null || true
            cp -v src-tauri/target/release/bundle/nsis/*.exe dist-installers/ 2>/dev/null || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp -v src-tauri/target/release/bundle/dmg/*.dmg dist-installers/ 2>/dev/null || true
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cp -v src-tauri/target/release/bundle/appimage/*.AppImage dist-installers/ 2>/dev/null || true
            cp -v src-tauri/target/release/bundle/deb/*.deb dist-installers/ 2>/dev/null || true
          fi
          ls -la dist-installers/

      - name: Generate Checksums
        shell: bash
        run: |
          cd dist-installers
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS.txt || shasum -a 256 "$file" >> SHA256SUMS.txt
            fi
          done
          cat SHA256SUMS.txt

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-installers/*

  publish-github-release:
    name: 🚀 Publish GitHub Release
    needs: build-release-installers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: open-studio-windows
          path: release-assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: open-studio-macos-arm64
          path: release-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: open-studio-linux-x64
          path: release-assets

      - name: Aggregate Master SHA-256 Checksums
        shell: bash
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS.txt
            fi
          done
          echo "=== Tamper-Evident SHA-256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
