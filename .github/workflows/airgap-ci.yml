name: Open Studio Zero-Telemetry CI & Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  airgap-security-audit:
    name: 🛡️ Zero-Telemetry Air-Gap Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Air-Gap Security Audit
        run: node scripts/verify-airgap.mjs

      - name: Upload Air-Gap Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airgap-audit-report
          path: .openstudio/airgap-audit-report.json

  frontend-and-extension-tests:
    name: 🧪 Frontend & Extension Test Suite
    needs: airgap-security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Full Vitest Suite
        run: npm test -- --run

      - name: Compile VS Code Extension Wedge
        run: npm run extensions:compile

      - name: Run VS Code Extension Suite
        run: npm run extensions:test

      - name: Production Desktop Bundle Build
        run: npm run build

      - name: Production Web Platform Build
        run: npm run web:build

  rust-backend-tests:
    name: 🦀 Rust Backend & Native Security Gate
    needs: airgap-security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux System Dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run Cargo Check & Backend Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
