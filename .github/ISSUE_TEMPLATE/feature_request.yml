name: Feature Request
description: Propose a new capability, local tool integration, or architectural enhancement.
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to Open Studio! All new features must adhere to our 100% offline, zero-telemetry architecture.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What limitation or friction does this feature solve?
      placeholder: "I find it difficult to..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution & User Experience
      description: Describe your proposed design, UI changes, or Rust/TypeScript architecture.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches or workarounds have you considered?
  - type: checkboxes
    id: airgap_commitment
    attributes:
      label: Air-Gap Compliance Pledge
      description: Open Studio features must remain 100% offline and privacy-preserving.
      options:
        - label: This proposed feature functions 100% locally without external cloud telemetry or tracking.
          required: true
